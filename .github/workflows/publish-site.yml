name: Publish ODaily galaxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "log/**"
      - "projects.yml"
      - "scripts/**"
      - "assets/**"
      - "_includes/**"
      - "_templates/**"
      - "projects/**"
      - "system/**"
      - "sky/**"
      - "galaxy/**"
      - "*.qmd"
      - "_quarto.yml"
      - "styles.scss"
      - "requirements.txt"
      - ".github/workflows/publish-site.yml"

concurrency:
  group: odaily-public-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out ODaily
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install data dependency
        run: python -m pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate the galaxy
        run: python scripts/build.py

      - name: Render the website
        run: quarto render

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=odaily2026
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
