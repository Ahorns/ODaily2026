name: Publish ODaily private writer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "writer/**"
      - ".github/workflows/publish-writer.yml"

concurrency:
  group: odaily-private-writer
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: writer
    steps:
      - name: Check out ODaily
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: writer/package-lock.json

      - name: Install writer dependencies
        run: npm ci

      - name: Test writer data conversion
        run: npm test

      - name: Check browser and function code
        run: npm run check

      - name: Publish private writer to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name=odaily-write --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
