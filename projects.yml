# Constellation registry.
#
# Slugs are permanent: a day entry refers to a project by slug forever, so
# renaming one orphans history. Change `name` freely, never the key. Grouping
# lives here rather than in the entries so it can be reorganised at any time
# without touching a single past day.
#
# Two separate things drive how a day's planet looks, and they are deliberately
# not the same thing:
#
#   `color`     WHAT you worked on. A day's planet is the blend of its projects'
#               colours, weighted by hours, so a split day is visibly a mixture
#               and no two working patterns look alike.
#   `category`  HOW you worked. It picks the terrain, when a session does not say
#               otherwise:
#                 writing -> ice     reading -> forest   coding  -> gas giant
#                 data    -> ocean   meeting -> volcanic admin   -> barren rock
#
# Omit `color` and the build assigns a stable one from the house palette.

groups:
  research:
    name: "Research"
    blurb: "The long arc — thesis, papers, experiments."
  craft:
    name: "Craft"
    blurb: "Tools and skills sharpened along the way."
  life:
    name: "Life"
    blurb: "Everything that is not work but still counts."

projects:
  odaily:
    name: "ODaily"
    group: craft
    category: coding
    color: "#4fc3f7"
    started: 2026-07-31
    status: active
    blurb: "This site — the log that keeps the rest of the log honest."

  # ---- Replace the examples below with your real projects. ----

